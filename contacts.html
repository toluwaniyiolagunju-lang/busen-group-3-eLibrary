<!DOCTYPE html>
<!-- E-Library contact page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Library Homepage</title>
  <link rel="stylesheet" href="Stylecontacts.css">
  <!-- Uses `Stylecontacts.css` for contact page styles. Note: filename case may matter on some servers. -->
</head>
<body>
  <!-- Contact page header and navigation -->
  <header class="site-header">
    <div class="brand">
      <span class="site-name">E-Library</span>
    </div>
    <nav class="site-nav">
      <a href="index.html">Home</a>  
      <a href="categories.html">Categories</a>
      <a href="contacts.html">Contact</a>
    </nav>
    <label for="auth-toggle" class="button button-primary">Login / Sign Up</label>
  </header>
  <input type="checkbox" id="auth-toggle" hidden>
    <div class="auth-modal">
      <div class="auth-card">
        <label for="auth-toggle" class="auth-close" title="Close">×</label>
        <div class="auth-header">
          <h2>Member Access</h2>
          <p>Login or sign up to save your favorite books.</p>
          <!-- Tabbed login and signup panels -->
        </div>
        <div class="auth-tabs">
          <input type="radio" id="tab-login" name="auth-tab" checked hidden>
          <input type="radio" id="tab-signup" name="auth-tab" hidden>
          <div class="auth-switch">
            <label for="tab-login">Login</label>
            <label for="tab-signup">Sign Up</label>
          </div>
          <div class="auth-forms">
            <div class="auth-panel login-panel">
              <label for="tab-login" class="auth-panel-title">Login</label>
              <div class="input-group">
                <label>Email address</label>
                <input type="email" placeholder="you@example.com" required>
              </div>
              <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Enter password" required>
              </div>
              <button class="button button-primary">Login</button>
            </div>
            <div class="auth-panel signup-panel">
              <label for="tab-signup" class="auth-panel-title">Sign Up</label>
              <div class="input-group">
                <label>Full name</label>
                <input type="text" placeholder="Your name" required>
              </div>
              <div class="input-group">
                <label>Email address</label>
                <input type="email" placeholder="you@example.com" required>
              </div>
              <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Create password" required>
              </div>
              <button class="button button-primary">Create Account</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  <!-- Simple contact header placeholder -->
  <div class="class-header">
    <h1>Contact list</h1>
  </div>
</body>
</html>
